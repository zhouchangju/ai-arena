<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AI Arena</title>
  <link rel="stylesheet" href="workspace.css">
  <link rel="stylesheet" href="provider-marks.css">
  <link rel="stylesheet" href="glass-material.css">
  <link rel="stylesheet" href="history-nav.css">
  <link rel="stylesheet" href="task-actions.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="我的讨论">
      <div class="brand">
        <span class="seal" aria-hidden="true">判</span>
        <span class="brand-copy">
          <span class="brand-title">AI Arena</span>
          <span class="brand-sub">本机讨论</span>
        </span>
      </div>

      <button class="new-session" id="new-session" type="button">
        <span class="new-session-mark" aria-hidden="true">＋</span>
        <span>新讨论</span>
      </button>

      <button class="history-nav-toggle" id="history-nav-toggle" type="button"
        aria-expanded="false" aria-controls="history-nav-panel" hidden>
        <span>历史</span>
        <span class="history-nav-caret" aria-hidden="true"></span>
      </button>

      <div class="history-head">
        <span>我的讨论</span>
        <span class="history-count" id="history-count">0</span>
      </div>

      <div class="search">
        <input id="history-search" type="search" placeholder="查找讨论" autocomplete="off" aria-label="查找我的讨论">
      </div>

      <div class="history-list" id="history-list" aria-live="polite"></div>

      <div class="sidebar-foot">
        <p>记录存在这个浏览器里，删除不影响网站上的对话。</p>
      </div>
    </aside>

    <main class="main">
      <div class="global-error" id="global-error" role="alert" hidden>
        <div class="global-error-copy">
          <strong>无法连接扩展后台</strong>
          <p id="global-error-text">请重新加载扩展后再试。</p>
        </div>
        <button class="btn" id="global-error-retry" type="button">重试</button>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <noscript>需要启用 JavaScript。</noscript>

  <script type="module" src="workspace.js"></script>
  <script type="module" src="history-nav.js"></script>
</body>
</html>
